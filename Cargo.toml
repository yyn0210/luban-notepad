[workspace]
resolver = "2"
members = [
    "crates/luban-core",
    "crates/luban-app",
    "crates/luban-plugin",
    "crates/luban-ohos",
]
# gpui-ohos declares its own workspace (it is a standalone, vendored crate).
exclude = ["vendor/gpui-ohos"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MulanPubL-2.0"
authors = ["Luban Notepad Contributors"]
repository = "https://github.com/luban-notepad/luban-notepad"
description = "A cross-platform, Rust reimplementation of the Notepad++ editing experience"

[workspace.dependencies]
anyhow = "1.0"
chardetng = "0.1.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6.0"
encoding_rs = "0.8.42"
log = "0.4"
regex = "1.13"
rust-i18n = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys-locale = "0.3"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Vendored GPUI crates (all at 0.3.11, matching gpui-kit 0.9.0 and gpui-ohos):
#
# - gpui-pre-linux carries a minimal X11 patch: a `WindowDecorations::Client`
#   request writes the borderless `_MOTIF_WM_HINTS` before the window is mapped
#   (no native titlebar flash) while the platform keeps reporting server
#   decorations so gpui-component adds no client-side shadow margin.
# - gpui-pre-platform carries an OpenHarmony fallback arm. gpui-kit depends on
#   this crate on every non-Apple/Android target, but upstream excludes OHOS
#   from `current_platform`, so the crate does not compile for
#   `aarch64-unknown-linux-ohos` without it. The real platform is injected by
#   `gpui_ohos::current_platform` in the OHOS entry point.
# - ohos-xcomponent-binding maps an unknown key code to `KeyCode::Unknown`
#   instead of panicking; `uinput`, media keys and vendor keyboards can report
#   evdev codes outside the generated OHOS enum.
# - openharmony-ability ignores ArkUI key events with unknown raw key codes
#   for the same reason (the ArkUI key path converts `key_code_raw` itself).
#
# See vendor/README.md.
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-platform = { path = "vendor/gpui-pre-platform" }
ohos-xcomponent-binding = { path = "vendor/ohos-xcomponent-binding" }
openharmony-ability = { path = "vendor/openharmony-ability" }
