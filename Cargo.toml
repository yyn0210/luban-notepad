[workspace]
resolver = "2"
members = [
    "crates/luban-core",
    "crates/luban-app",
]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "MulanPubL-2.0"
authors = ["Luban Notepad Contributors"]
repository = "https://github.com/luban-notepad/luban-notepad"
description = "A cross-platform, Rust reimplementation of the Notepad++ editing experience"

[workspace.dependencies]
anyhow = "1.0"
chardetng = "0.1.17"
dirs = "6.0"
encoding_rs = "0.8.42"
log = "0.4"
regex = "1.13"
rust-i18n = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys-locale = "0.3"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
