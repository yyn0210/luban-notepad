name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (build, test, GUI smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb1-dev libxcb-xkb-dev \
            libfontconfig1-dev libfreetype-dev \
            libbz2-dev libpng-dev libbrotli-dev libffi-dev zlib1g-dev \
            libexpat1-dev uuid-dev \
            mesa-vulkan-drivers xvfb xauth xdotool ffmpeg

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build GUI
        run: cargo build -p luban-app

      - name: GUI smoke test (Xvfb + lavapipe)
        run: |
          export WGPU_BACKEND=vulkan
          export LUBAN_NOTEPAD_CONFIG_DIR="$RUNNER_TEMP/luban-config"
          xvfb-run -a -s "-screen 0 1440x900x24" \
            timeout 30 target/debug/luban-notepad --smoke-test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: Extension smoke test (Xvfb + lavapipe)
        run: scripts/smoke-extensions.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: GUI integration test (Xvfb + xdotool)
        run: scripts/gui-integration.sh --require-display
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LUBAN_GUI_ARTIFACTS: ${{ runner.temp }}/gui-artifacts

      - name: Upload GUI integration artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-integration-artifacts
          path: ${{ runner.temp }}/gui-artifacts
          if-no-files-found: ignore

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release -p luban-app

      - name: Verify executable icon
        shell: pwsh
        run: |
          $signature = @'
          using System;
          using System.Runtime.InteropServices;
          public static class IconCheck {
              [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
              public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint count);
          }
          '@
          Add-Type -TypeDefinition $signature
          $count = [IconCheck]::ExtractIconEx("$PWD\target\release\luban-notepad.exe", -1, $null, $null, 0)
          if ($count -lt 1) { throw "luban-notepad.exe has no icon resource" }
          Write-Host "embedded icon groups: $count"

  macos:
    name: macOS
    # Match the release workflow: macos-14 jobs were being cancelled while
    # still queued, while macos-15 obtained runners.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release -p luban-app

      - name: Package app bundle
        run: scripts/package-macos.sh --skip-build

      - name: Verify bundle icon
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" \
            "dist/Luban Notepad.app/Contents/Info.plist"
          test -f "dist/Luban Notepad.app/Contents/Resources/luban-notepad.icns"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: luban-notepad-macos
          path: |
            dist/*.zip
            dist/*.zip.sha256

  ohos:
    name: OpenHarmony arm64 (native library + HAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Public OpenHarmony 7.0 SDK (API 26). The HAP product in
      # crates/luban-ohos/ohos/build-profile.openharmony.json5 targets it.
      OHOS_SDK_API: "26.0.0"
      OHOS_SDK_VERSION: "26.0.0.38-Beta"
      OHOS_SDK_URL: https://repo.huaweicloud.com/openharmony/os/7.0-Release/ohos-sdk-windows_linux-public.tar.gz
      OHOS_SDK_SHA256: 130a438cbcddd46a2a5b09ee9925339cddf4cca99223329b860f96a5c72f338f

      # The DevEco command-line tools provide ohpm. hvigor comes from the
      # HarmonyOS npm registry separately because the bundled hvigor 5.18.5
      # cannot read the metaVersion 3.0.2 SDK metadata used by API 26.
      OHOS_CLI_VERSION: "5.1.0.840"
      OHOS_CLI_URL: https://repo.huaweicloud.com/harmonyos/ohpm/5.1.0/commandline-tools-linux-x64-5.1.0.840.zip
      OHOS_CLI_SHA256: 1dcefa4741dc289277560b2802040e0c45b433898d8db453d711d5376e0478f1
      HVIGOR_VERSION: "6.26.20"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ohos-${{ env.OHOS_SDK_VERSION }}

      # ohrs sets the NDK linker and sysroot for cargo. Cache the binary
      # because a fresh `cargo install` takes a few minutes.
      - name: Cache ohrs
        id: ohrs
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ohrs
          key: ohrs-1.5.0

      - name: Install ohrs
        if: steps.ohrs.outputs.cache-hit != 'true'
        run: cargo install ohrs --version 1.5.0 --locked

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The public SDK archive bundles every component (3.4 GB). Cache the
      # extracted API directory so only a cold cache pays the download.
      - name: Cache OpenHarmony SDK
        id: ohos-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ohos-sdk
          key: ohos-sdk-${{ env.OHOS_SDK_VERSION }}

      - name: Install OpenHarmony SDK
        if: steps.ohos-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ohos-sdk.tar.gz"
          staging="$RUNNER_TEMP/ohos-sdk-zips"
          root="$RUNNER_TEMP/ohos-sdk/$OHOS_SDK_API"
          mkdir -p "$root" "$staging"
          curl -fL --retry 3 --retry-all-errors --retry-delay 5 -o "$archive" "$OHOS_SDK_URL"
          echo "$OHOS_SDK_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$staging" --wildcards 'ohos-sdk/linux/*.zip'
          for component in "$staging"/ohos-sdk/linux/*.zip; do
            unzip -q -o "$component" -d "$root"
          done
          rm -rf "$archive" "$staging"

      # Only ohpm is needed from the command-line tools; its bundled SDK and
      # hvigor are skipped, so the extracted cache entry stays small.
      - name: Cache OHPM
        id: ohpm
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ohos-cli
          key: ohpm-${{ env.OHOS_CLI_VERSION }}

      - name: Install OHPM
        if: steps.ohpm.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/commandline-tools.zip"
          curl -fL --retry 3 --retry-all-errors --retry-delay 5 -o "$archive" "$OHOS_CLI_URL"
          echo "$OHOS_CLI_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ohos-cli"
          unzip -q -o "$archive" 'command-line-tools/ohpm/*' -d "$RUNNER_TEMP/ohos-cli"
          rm -f "$archive"

      - name: Configure OpenHarmony toolchain
        run: |
          {
            echo "OHOS_BASE_SDK_HOME=$RUNNER_TEMP/ohos-sdk"
            echo "DEVECO_SDK_HOME=$RUNNER_TEMP/ohos-sdk"
            echo "OHOS_NDK_HOME=$RUNNER_TEMP/ohos-sdk/$OHOS_SDK_API"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ohos-cli/command-line-tools/ohpm/bin" >> "$GITHUB_PATH"

      - name: Install hvigor
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ohos-hvigor"
          npm install --prefix "$RUNNER_TEMP/ohos-hvigor" \
            --no-audit --no-fund --registry https://repo.harmonyos.com/npm/ \
            "@ohos/hvigor@$HVIGOR_VERSION" "@ohos/hvigor-ohos-plugin@$HVIGOR_VERSION"
          rm -rf crates/luban-ohos/ohos/node_modules
          ln -s "$RUNNER_TEMP/ohos-hvigor/node_modules" \
            crates/luban-ohos/ohos/node_modules

      - name: Build OHOS native library
        run: |
          crates/luban-ohos/scripts/build-hap.sh \
            --profile "$GITHUB_WORKSPACE/crates/luban-ohos/ohos/build-profile.openharmony.json5" \
            --release

      - name: Verify native library
        run: |
          set -euo pipefail
          lib=crates/luban-ohos/dist/arm64-v8a/libluban_ohos.so
          test -f "$lib"
          file "$lib"
          readelf -h "$lib" | grep -q 'AArch64'

      - name: Install ArkTS dependencies
        working-directory: crates/luban-ohos/ohos
        run: ohpm install --all

      - name: Assemble HAP
        working-directory: crates/luban-ohos/ohos
        run: |
          node "$RUNNER_TEMP/ohos-hvigor/node_modules/@ohos/hvigor/bin/hvigor.js" \
            --mode module -p product=default -p buildMode=release assembleHap --no-daemon

      - name: Verify HAP
        run: |
          set -euo pipefail
          hap=$(find crates/luban-ohos/ohos/entry/build -name '*-unsigned.hap' -print -quit)
          if [ -z "$hap" ]; then
            echo "::error::no unsigned HAP was produced"
            exit 1
          fi
          entries="$RUNNER_TEMP/ohos-hap-entries.txt"
          unzip -Z1 "$hap" > "$entries"
          grep -qx 'libs/arm64-v8a/libluban_ohos.so' "$entries"
          grep -qx 'libs/arm64-v8a/libc++_shared.so' "$entries"
          module_json="$RUNNER_TEMP/ohos-module.json"
          unzip -p "$hap" module.json > "$module_json"
          grep -q '"requestPermissions"' "$module_json"
          grep -q 'ohos.permission.READ_PASTEBOARD' "$module_json"
          unzip -p "$hap" pack.info
          ls -lh "$hap"

      - name: Upload OHOS native library and HAP
        uses: actions/upload-artifact@v4
        with:
          name: ohos-arm64
          path: |
            crates/luban-ohos/dist/arm64-v8a/libluban_ohos.so
            crates/luban-ohos/dist/arm64-v8a/libc++_shared.so
            crates/luban-ohos/ohos/entry/build/default/outputs/default/*-unsigned.hap
          if-no-files-found: error
          retention-days: 7
