name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (build, test, GUI smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb1-dev libxcb-xkb-dev \
            libfontconfig1-dev libfreetype-dev \
            libbz2-dev libpng-dev libbrotli-dev libffi-dev zlib1g-dev \
            libexpat1-dev uuid-dev \
            mesa-vulkan-drivers xvfb xauth xdotool ffmpeg

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build GUI
        run: cargo build -p luban-app

      - name: GUI smoke test (Xvfb + lavapipe)
        run: |
          export WGPU_BACKEND=vulkan
          export LUBAN_NOTEPAD_CONFIG_DIR="$RUNNER_TEMP/luban-config"
          xvfb-run -a -s "-screen 0 1440x900x24" \
            timeout 30 target/debug/luban-notepad --smoke-test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: Extension smoke test (Xvfb + lavapipe)
        run: scripts/smoke-extensions.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: GUI integration test (Xvfb + xdotool)
        run: scripts/gui-integration.sh --require-display
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LUBAN_GUI_ARTIFACTS: ${{ runner.temp }}/gui-artifacts

      - name: Upload GUI integration artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-integration-artifacts
          path: ${{ runner.temp }}/gui-artifacts
          if-no-files-found: ignore

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release -p luban-app

      - name: Verify executable icon
        shell: pwsh
        run: |
          $signature = @'
          using System;
          using System.Runtime.InteropServices;
          public static class IconCheck {
              [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
              public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint count);
          }
          '@
          Add-Type -TypeDefinition $signature
          $count = [IconCheck]::ExtractIconEx("$PWD\target\release\luban-notepad.exe", -1, $null, $null, 0)
          if ($count -lt 1) { throw "luban-notepad.exe has no icon resource" }
          Write-Host "embedded icon groups: $count"

  macos:
    name: macOS
    # Match the release workflow: macos-14 jobs were being cancelled while
    # still queued, while macos-15 obtained runners.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release -p luban-app

      - name: Package app bundle
        run: scripts/package-macos.sh --skip-build

      - name: Verify bundle icon
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" \
            "dist/Luban Notepad.app/Contents/Info.plist"
          test -f "dist/Luban Notepad.app/Contents/Resources/luban-notepad.icns"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: luban-notepad-macos
          path: |
            dist/*.zip
            dist/*.zip.sha256

  ohos:
    name: OpenHarmony arm64 (cross-compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ohos

      # ohrs sets the NDK linker and sysroot for cargo. Cache the binary
      # because a fresh `cargo install` takes a few minutes.
      - name: Cache ohrs
        id: ohrs
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ohrs
          key: ohrs-1.5.0

      - name: Install ohrs
        if: steps.ohrs.outputs.cache-hit != 'true'
        run: cargo install ohrs --version 1.5.0 --locked

      # The public SDK archive bundles every component. Only the native one is
      # needed to link the cdylib, so cache that zip (835 MB) and extract it
      # into a separate directory to keep the cache small.
      - name: Cache OpenHarmony native SDK
        id: ohos-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ohos-sdk/linux/native-linux-x64-6.1.0.31-Release.zip
          key: ohos-native-6.1.0.31

      - name: Download OpenHarmony SDK
        if: steps.ohos-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ohos-sdk/linux"
          archive="$RUNNER_TEMP/ohos-sdk.tar.gz"
          curl -fL --retry 3 --retry-delay 5 \
            -o "$archive" \
            https://repo.huaweicloud.com/openharmony/os/6.1-Release/ohos-sdk-windows_linux-public.tar.gz
          echo "b833b75a64ee46bbd7880921abbb49b733ec5c8171b6684c9b524d57f624cee0  $archive" |
            sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP/ohos-sdk" \
            linux/native-linux-x64-6.1.0.31-Release.zip
          rm -f "$archive"

      - name: Extract OpenHarmony native SDK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ohos-ndk/linux"
          unzip -q -o \
            "$RUNNER_TEMP/ohos-sdk/linux/native-linux-x64-6.1.0.31-Release.zip" \
            -d "$RUNNER_TEMP/ohos-ndk/linux"
          echo "OHOS_NDK_HOME=$RUNNER_TEMP/ohos-ndk/linux" >> "$GITHUB_ENV"

      - name: Build OHOS native library
        working-directory: crates/luban-ohos
        run: ohrs build --arch arm64 --release

      - name: Verify native library
        working-directory: crates/luban-ohos
        run: |
          set -euo pipefail
          lib=dist/arm64-v8a/libluban_ohos.so
          test -f "$lib"
          file "$lib"
          readelf -h "$lib" | grep -q 'AArch64'

      - name: Upload OHOS native library
        uses: actions/upload-artifact@v4
        with:
          name: ohos-arm64
          path: |
            crates/luban-ohos/dist/arm64-v8a/libluban_ohos.so
            crates/luban-ohos/dist/arm64-v8a/libc++_shared.so
          if-no-files-found: error
          retention-days: 7
