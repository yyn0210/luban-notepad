name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (build, test, GUI smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb1-dev libxcb-xkb-dev \
            libfontconfig1-dev libfreetype-dev \
            libbz2-dev libpng-dev libbrotli-dev libffi-dev zlib1g-dev \
            libexpat1-dev uuid-dev \
            mesa-vulkan-drivers xvfb xauth

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build GUI
        run: cargo build -p luban-app

      - name: GUI smoke test (Xvfb + lavapipe)
        run: |
          export WGPU_BACKEND=vulkan
          export LUBAN_NOTEPAD_CONFIG_DIR="$RUNNER_TEMP/luban-config"
          xvfb-run -a -s "-screen 0 1440x900x24" \
            timeout 30 target/debug/luban-notepad --smoke-test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release -p luban-app

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release -p luban-app
