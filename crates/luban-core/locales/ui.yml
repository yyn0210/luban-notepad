core.document.no_path:
  en: "document has no path"
  zh-CN: "文档尚未关联文件路径"
core.document.read_only:
  en: "document is read-only"
  zh-CN: "文档为只读"
core.document.partial_save_as:
  en: "this file was partially opened; use Save As to keep the opened portion"
  zh-CN: "该文件是部分打开的，请使用“另存为”保存已打开的部分"
core.document.partial_same_path:
  en: "cannot save a partially opened file over its source; choose another name"
  zh-CN: "不能把部分打开的内容写回源文件，请选择其他文件名"
core.document.partial_reload:
  en: "reload is not available for partially opened files"
  zh-CN: "部分打开的文件不支持重新加载"

core.search.empty_text:
  en: "search text is empty"
  zh-CN: "搜索内容为空"
core.search.empty_pattern:
  en: "empty search pattern"
  zh-CN: "搜索模式为空"
core.search.invalid_regex:
  en: "invalid regular expression: %{error}"
  zh-CN: "无效的正则表达式：%{error}"

core.encoding.decode_failed:
  en: "could not decode input"
  zh-CN: "无法解码输入"

core.disk_engine.not_text:
  en: "the file does not look like text; use the partial-range open instead"
  zh-CN: "该文件不是文本文件，请改用部分范围打开"
core.disk_engine.corrupt_index:
  en: "the disk-engine index is inconsistent; reload the file"
  zh-CN: "磁盘引擎索引不一致，请重新加载文件"
core.disk_engine.journal_corrupt:
  en: "the edit journal is unreadable; save to another file to recover the text"
  zh-CN: "编辑日志无法读取，请另存为新文件以保留内容"
core.disk_engine.invalid_edit:
  en: "the edit position is outside the document"
  zh-CN: "编辑位置超出文档范围"
core.disk_engine.save_in_progress:
  en: "a save is in progress; editing resumes when it finishes"
  zh-CN: "正在保存，保存完成后可以继续编辑"
core.disk_engine.external_change:
  en: "the file changed on disk after it was opened; reload it or save to another path"
  zh-CN: "文件在打开后已被外部修改；请重新加载或另存为其他文件"
core.document.huge_save_flow:
  en: "disk-engine documents are saved through the background save flow"
  zh-CN: "磁盘引擎文档需要通过后台保存流程写入"
core.disk_engine.file_changed_during_index:
  en: "the file changed while it was being indexed; open it again"
  zh-CN: "文件在建立索引期间发生变化，请重新打开"
core.disk_engine.recovery_source_missing:
  en: "the file to recover is missing: %{path}"
  zh-CN: "待恢复的文件不存在：%{path}"
core.disk_engine.recovery_source_changed:
  en: "the file changed after the recovery checkpoint; open the current file instead: %{path}"
  zh-CN: "文件在恢复检查点之后发生变化，请改为打开当前文件：%{path}"
core.disk_engine.recovery_corrupt:
  en: "the recovery data is inconsistent and cannot be replayed"
  zh-CN: "恢复数据不一致，无法重放"

core.file_ops.name_empty:
  en: "the name cannot be empty"
  zh-CN: "名称不能为空"
core.file_ops.name_dot:
  en: "the name cannot be . or .."
  zh-CN: "名称不能是 . 或 .."
core.file_ops.name_separator:
  en: "the name cannot contain a path separator"
  zh-CN: "名称不能包含路径分隔符"
core.file_ops.name_nul:
  en: "the name cannot contain a NUL character"
  zh-CN: "名称不能包含空字符"
core.file_ops.exists:
  en: "a file or folder with that name already exists"
  zh-CN: "同名文件或文件夹已存在"
core.file_ops.trash_failed:
  en: "could not move the item to the trash: %{error}"
  zh-CN: "无法将项目移到回收站：%{error}"

core.file_ops.rename_same_parent:
  en: "a rename must stay in the same folder; use Save As to move a file"
  zh-CN: "重命名不能跨文件夹；移动文件请使用另存为"
