[package]
name = "luban-app"
description = "Cross-platform GPUI desktop application for Luban Notepad"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "luban-notepad"

[lib]
name = "luban_app"
path = "src/lib.rs"

[[bin]]
name = "luban-notepad"
path = "src/main.rs"

[dependencies]
luban-core = { path = "../luban-core" }
luban-plugin = { path = "../luban-plugin" }
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
env_logger = "0.11"
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
image = { version = "0.25", default-features = false, features = ["png"] }
interprocess = "2.4"
log.workspace = true
notify = "8.2"
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy", "plist-load"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "socks-proxy"] }
walkdir.workspace = true

# OpenHarmony reports target_os = "linux" but has no X11; gate the X11-only
# dependencies on the absence of target_env = "ohos".
[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
raw-window-handle = "0.6"
x11rb = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
serde-saphyr = "1.3"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
