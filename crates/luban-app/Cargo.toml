[package]
name = "luban-app"
description = "Cross-platform GPUI desktop application for Luban Notepad"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "luban-notepad"

[[bin]]
name = "luban-notepad"
path = "src/main.rs"

[dependencies]
luban-core = { path = "../luban-core" }
anyhow.workspace = true
dirs.workspace = true
env_logger = "0.11"
gpui-kit = { version = "0.8.0", features = ["syntect"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log.workspace = true
notify = "8.2"
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy", "plist-load"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
walkdir.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11rb = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
serde-saphyr = "1.3"
tempfile = "3"
